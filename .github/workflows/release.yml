# Publishes a GitHub release (main.js, manifest.json, styles.css) for the version in
# manifest.json. BRAT installs and auto-updates Yarn from these releases.
#
# Runs when:
#  - main is pushed with a manifest.json change (bump the version → new release),
#  - a tag like 0.2.4 is pushed,
#  - or it is started by hand from the Actions tab.
# If a release for the current version already exists, it does nothing.
name: Release

on:
  push:
    branches: [main]
    paths: [manifest.json]
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read version
        id: v
        run: echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"
      - name: Check tag matches manifest version
        if: github.ref_type == 'tag'
        run: |
          if [ "${{ steps.v.outputs.version }}" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME != manifest version ${{ steps.v.outputs.version }}"; exit 1
          fi
      - name: Skip if already released
        id: exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.v.outputs.version }}" >/dev/null 2>&1; then echo "yes=1" >> "$GITHUB_OUTPUT"; fi
      - if: steps.exists.outputs.yes != '1'
        run: npm ci && npm run build
      - name: Create release
        if: steps.exists.outputs.yes != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.v.outputs.version }}" main.js manifest.json styles.css \
            --target "$GITHUB_SHA" --title "${{ steps.v.outputs.version }}" --generate-notes
